# OKA Room Reservation Platform
#
# PostgreSQL is NOT part of this stack: the application connects to the external
# database server configured in DATABASE_URL (.env). The app container only
# needs outbound access to that host on port 5432.
#
# Start:  docker-compose up -d
# Logs:   docker-compose logs -f app

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    # Caddy needs .env so it can resolve {$APP_DOMAIN} from the Caddyfile.
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    # Override by setting APP_IMAGE in .env, or build locally with:
    #   docker build -t oka-reservation:latest .
    image: ${APP_IMAGE:-oka-reservation:latest}
    # Bound to localhost only. Public traffic arrives via Caddy on 80/443.
    # Keeping the loopback binding allows the documented health check:
    #   curl http://localhost:3000/api/auth/session
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
