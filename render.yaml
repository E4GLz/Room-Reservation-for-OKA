# Render Blueprint — provisions the database AND the web service together.
#
# In Render: New > Blueprint > connect this repository. Render reads this file
# and creates both resources. Values marked `sync: false` are not stored here
# and must be filled in once in the dashboard.
#
# The container entrypoint runs `prisma migrate deploy && npm run seed` before
# starting, so a freshly created database builds its own schema on first boot.
#
# PLANS: both resources start on `free` so nothing is charged while you
# evaluate. Two limits matter before this carries real bookings:
#   - a free database is REMOVED AFTER 30 DAYS
#   - a free web service sleeps after 15 minutes idle (~50s to wake)
# Change both to `starter` (about $7/month each) for anything people rely on.

databases:
  - name: oka-reservation-db
    databaseName: room_reservation
    user: oka_user
    plan: free
    # MUST match the web service's region. Internal networking only works
    # within a region, so a mismatch here means the app cannot reach the
    # database at all — and the error looks like a generic connection failure.
    region: frankfurt
    # Empty means NO external connections: only the web service reaches it, over
    # Render's internal network. That is the safe default and should stay this
    # way in normal operation.
    #
    # To load the existing 6,019 rows you must open it briefly: in the Render
    # dashboard add your current public IP to this allow list, run
    #   node scripts/restore-db.js <backupDir> --yes
    # against the database's EXTERNAL connection string, then remove the entry.
    ipAllowList: []

services:
  - type: web
    name: oka-reservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/auth/session
    autoDeploy: true
    envVars:
      # Supplied by Render from the database above. The app and database talk
      # over Render's internal network, so no firewall rule is needed.
      - key: DATABASE_URL
        fromDatabase:
          name: oka-reservation-db
          property: connectionString

      # Generated once by Render and then kept stable. Changing SESSION_SECRET
      # later signs every user out.
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      # Set these in the dashboard. Use a REAL address for ADMIN_EMAIL: the
      # account seeded from it receives approval and reminder mail, and the
      # current admin@company.internal is not a deliverable domain.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
